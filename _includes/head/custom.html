<style>
  /* Plum accent, white page — overrides the default theme's blue. */
  :root {
    --global-link-color: #7a3559;
    --global-link-color-hover: #5c2742;
    --global-link-color-visited: #7a3559;
    --global-bg-color: #ffffff;
    --global-masthead-link-color: #1f1f1e;
    --global-border-color: #e2dfd8;
  }

  .masthead { background: #ffffff; border-bottom: 1px solid #e2dfd8; }
  .page__footer { background: #ffffff; border-top: 1px solid #e2dfd8; }
  .author__avatar img { border: 2px solid #e2dfd8; }
   .author__avatar img { border: 2px solid #e2dfd8; }
  .page__footer-follow { display: none; }
 .masthead { background: #ffffff; border-bottom: 1px solid #e2dfd8; }
.greedy-nav { background: transparent; }
.greedy-nav a { color: #1f1f1e; }
.greedy-nav .visible-links a:before { background: #7a3559; height: 2px; }
.greedy-nav a:hover { color: #7a3559; }
 .greedy-nav a.is-current {
  color: #7a3559 !important;
  font-weight: 600;
}
 .greedy-nav a.is-current:after {
  content: '';
  display: block;
  height: 2px;
  background: #7a3559;
  margin-top: 3px;
}
 <style>
  .masthead .site-title { color: #7a3559 !important; }
  .page__footer { display: none; }
 .masthead .site-title,
.masthead .site-title a,
.masthead .greedy-nav .site-title,
.greedy-nav > .site-title,
a.site-title {
  color: #7a3559 !important;
}
 <style>
  /* your existing rules — plum links, site title, hidden footer, etc. */
  .masthead .site-title { color: #7a3559 !important; }
  .page__footer { display: none; }

  /* new: headings */
  .page__content h2,
  .page__content h3 {
    color: #7a3559;
    border-bottom-color: #e8dde3;
  }

  /* new: blockquote */
  .page__content blockquote {
    border-left: 3px solid #7a3559;
    color: #4a4a48;
  }

  /* new: sidebar */
  .sidebar {
    background: #faf6f8;
    padding: 1.25rem 1rem;
    border-radius: 6px;
  }
  .author__name { color: #7a3559; }
  .author__urls .fa, .author__urls .ai { color: #7a3559; }
 .author__avatar img {
  width: 200px;
  height: 200px;
  object-fit: cover;
  object-position: center 30%;
  border-radius: 50%;
}
 .highlight {
  background: linear-gradient(180deg, transparent 55%, #f3d4e2 55%);
  padding: 0 0.15em;
  font-weight: 500;
}
 .marker {
  background-image: linear-gradient(
    100deg,
    rgba(243, 212, 226, 0) 0.5%,
    rgba(243, 212, 226, 0.85) 2%,
    rgba(243, 212, 226, 0.75) 95%,
    rgba(243, 212, 226, 0) 99.5%
  );
  background-repeat: no-repeat;
  background-size: 100% 62%;
  background-position: 0 78%;
  padding: 0 0.3em 0.1em;
  border-radius: 0.2em;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
}
