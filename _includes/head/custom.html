<!-- favicon -->

<!-- Site stylesheets. Bump the ?v= number whenever you edit one of these,
     or browsers will keep serving the old cached copy. -->
<link rel="stylesheet" href="{{ '/assets/css/topic-curves.css' | relative_url }}?v=6">
<link rel="stylesheet" href="{{ '/assets/css/research-highlights.css' | relative_url }}?v=1">

<style>
  /* ============================================================
     Plum accent on white. One <style> block only — every rule
     below lives between these two tags. Anything pasted outside
     them will print on the page as visible text.
     ============================================================ */

  :root {
    --global-link-color: #7a3559;
    --global-link-color-hover: #5c2742;
    --global-link-color-visited: #7a3559;
    --global-bg-color: #ffffff;
    --global-masthead-link-color: #1f1f1e;
    --global-border-color: #e2dfd8;
  }

  /* ---- masthead ---- */

  .masthead {
    background: #ffffff;
    border-bottom: 1px solid #e2dfd8;
  }

  .masthead .site-title,
  .masthead .site-title a,
  .masthead .greedy-nav .site-title,
  .greedy-nav > .site-title,
  a.site-title {
    color: #7a3559 !important;
    font-weight: 600;
  }

  .greedy-nav { background: transparent; }
  .greedy-nav a { color: #1f1f1e; }
  .greedy-nav a:hover { color: #7a3559; }
  .greedy-nav .visible-links a:before { background: #7a3559; height: 2px; }

  /* current page, set by the script at the bottom of this file */
  .greedy-nav a.is-current { color: #7a3559 !important; font-weight: 600; }
  .site-title.is-current:after { display: none; }

  /* dark-mode toggle removed */
  .theme-toggle, #theme-toggle, .masthead__theme-toggle { display: none; }

  /* ---- sidebar ---- */

  .sidebar {
    background: #faf6f8;
    padding: 1.25rem 1rem;
    border-radius: 6px;
  }

  .author__name { color: #7a3559; }
  .author__urls .fa, .author__urls .ai { color: #7a3559; }

  .author__avatar img {
    width: 200px;
    height: 200px;
    object-fit: cover;
    object-position: center 30%;
    border-radius: 50%;
    border: 2px solid #e2dfd8;
  }

  /* ---- page content ---- */

  .page__content h2,
  .page__content h3 {
    color: #7a3559;
    border-bottom: 0;
  }

  .page__content blockquote {
    border-left: 3px solid #7a3559;
    color: #4a4a48;
  }

  /* ---- highlighter marker ---- */

  .marker {
    display: inline;
    background-image: linear-gradient(
      100deg,
      rgba(243, 212, 226, 0) 0.5%,
      rgba(243, 212, 226, 0.85) 2%,
      rgba(243, 212, 226, 0.75) 95%,
      rgba(243, 212, 226, 0) 99.5%
    );
    background-repeat: no-repeat;
    background-size: 100% 62%;
    background-position: 0 78%;
    padding: 0 0.3em 0.1em;
    border-radius: 0.2em;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  /* slight angle variation so repeated markers don't look stamped */
  .page__content h2:nth-of-type(even) .marker {
    background-image: linear-gradient(
      80deg,
      rgba(243, 212, 226, 0) 0.5%,
      rgba(243, 212, 226, 0.8) 2%,
      rgba(243, 212, 226, 0.7) 95%,
      rgba(243, 212, 226, 0) 99.5%
    );
  }
     /* ---- news timeline ---- */

  .news-list { list-style: none; padding-left: 0; margin-left: 0; }
  .news-list li {
    position: relative;
    padding: 0 0 0.9rem 1.5rem;
    border-left: 2px solid #f0e2e9;
    line-height: 1.5;
  }
  .news-list li:last-child { border-left-color: transparent; padding-bottom: 0; }
  .news-list li::before {
    content: '';
    position: absolute;
    left: -5px; top: 8px;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #7a3559;
  }
  .news-list strong { color: #7a3559; font-weight: 600; }

  /* ---- interest pills ---- */

  .interest-tags {
    list-style: none;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .interest-tags li {
    padding: 0.35rem 0.85rem;
    border: 1px solid #e8dde3;
    border-radius: 999px;
    font-size: 0.9rem;
    background: #faf6f8;
  }

  /* ---- footer ---- */

  .page__footer { display: none; }
</style>

<script>
  /* Marks the current page's nav link so it can be styled plum. */
  document.addEventListener('DOMContentLoaded', function () {
    var here = window.location.pathname.replace(/\/$/, '');
    var links = document.querySelectorAll('.greedy-nav a');
    Array.prototype.forEach.call(links, function (a) {
      var href = a.getAttribute('href');
      if (!href) return;
      var target = href.replace(/\/$/, '');
      if (target === here) a.classList.add('is-current');
    });
  });
</script>
